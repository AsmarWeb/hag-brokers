name: Deploy HAG Brokers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hostinger
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            set -e

            cd /home/u498553347/domains/hagbrokers.net/public_html

            echo "Updating repository..."
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo "Entering Laravel application..."
            cd src

            echo "Installing PHP dependencies..."
            /opt/alt/php84/usr/bin/php $(which composer) install \
              --no-dev \
              --optimize-autoloader

            echo "Installing frontend dependencies..."
            export PATH="/opt/alt/alt-nodejs22/root/usr/bin:$PATH"
            npm ci

            echo "Building frontend..."
            npm run build

            echo "Clearing Laravel caches..."
            /opt/alt/php84/usr/bin/php artisan config:clear
            /opt/alt/php84/usr/bin/php artisan route:clear
            /opt/alt/php84/usr/bin/php artisan view:clear

            echo "Caching Laravel configuration..."
            /opt/alt/php84/usr/bin/php artisan config:cache
            /opt/alt/php84/usr/bin/php artisan route:cache
            /opt/alt/php84/usr/bin/php artisan view:cache

            echo "Deployment completed successfully."
