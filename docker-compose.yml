services:
  # -------------------------------------------------------
  # Laravel Bootstrap
  # -------------------------------------------------------
  bootstrap:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    working_dir: /var/www/html

    volumes:
      - ./src:/var/www/html
      - composer_cache:/tmp/composer-cache

    environment:
      APP_ENV: local
      COMPOSER_CACHE_DIR: /tmp/composer-cache

    entrypoint: ["/usr/local/bin/bootstrap.sh"]
    command: ["bootstrap"]

    depends_on:
      redis:
        condition: service_started

  # -------------------------------------------------------
  # Laravel Application
  # -------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    working_dir: /var/www/html

    volumes:
      - ./src:/var/www/html

    environment:
      APP_ENV: local

      # SQLite
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite

      # Redis
      REDIS_HOST: redis

    depends_on:
      bootstrap:
        condition: service_completed_successfully

      redis:
        condition: service_started

  # -------------------------------------------------------
  # Nginx
  # -------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine

    ports:
      - "8080:80"

    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      app:
        condition: service_started

  # -------------------------------------------------------
  # Redis
  # -------------------------------------------------------
  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped

  # -------------------------------------------------------
  # Laravel Queue Worker
  # -------------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    working_dir: /var/www/html

    command:
      ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]

    volumes:
      - ./src:/var/www/html

    environment:
      APP_ENV: local

      # SQLite
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite

      # Redis
      REDIS_HOST: redis

    depends_on:
      bootstrap:
        condition: service_completed_successfully

      redis:
        condition: service_started

    restart: unless-stopped

  # -------------------------------------------------------
  # Laravel Scheduler
  # -------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    working_dir: /var/www/html

    command:
      [
        "sh",
        "-lc",
        "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done",
      ]

    volumes:
      - ./src:/var/www/html

    environment:
      APP_ENV: local

      # SQLite
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite

      # Redis
      REDIS_HOST: redis

    depends_on:
      bootstrap:
        condition: service_completed_successfully

      redis:
        condition: service_started

    restart: unless-stopped

  # -------------------------------------------------------
  # Mailpit
  # -------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest

    ports:
      - "8025:8025"
      - "1025:1025"

    restart: unless-stopped

# ---------------------------------------------------------
# Persistent Volumes
# ---------------------------------------------------------
volumes:
  redis_data:
    driver: local

  composer_cache:
    driver: local
